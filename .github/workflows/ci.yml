# Verify quality before merge / production promotion.
# Wire this check in Vercel → Project → Deployment Checks → GitHub → "CI / verify"
# so production is not aliased until this job passes.
name: CI

on:
  pull_request:
    branches: [master, testing]
  push:
    branches: [master, testing]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
